<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="t d">
<title id="t">VisionFSD desktop pipeline</title><desc id="d">Camera or video frames go to a newest-frame reader, then four throttled OpenVINO models, then scene logic with a sticky lead vehicle, then an OpenGL world view and an annotated camera view. Output is display only.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#38D6F5"/></marker></defs>

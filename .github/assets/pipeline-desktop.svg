<text x="40" y="46" text-anchor="start" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#E6EEF5">Desktop Pilot · one frame's journey</text>
<text x="40" y="72" text-anchor="start" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#8AA4B8">newest frame wins · each model runs asynchronously every N display frames, so the display never waits on inference</text>
<text x="40" y="112" text-anchor="start" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#5F7C92">INPUT</text>
